{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container">
    <h1>Новая тема</h1>

    <h3>Раздел: {{ section.title }}</h3>

        <form method="post">
            {% csrf_token %}
            {% for f in form %}
                {{ f }}
                <div class="form-error">
                  {% if f.errors %}
                  <ul class="errorlist nonfield">
                    {% for error in f.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                  </ul>
                  {% endif %}
                </div>
            {% endfor %}
            <button type="submit">Создать</button>
        </form>
</div>

{% endblock %}
