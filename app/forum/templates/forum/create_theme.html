{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container">
    <div class="my-border border-color-orange title-create-page">
        <div class="page-title p-3">
            {{ title }}
        </div>
    </div>

        <form method="post">
            {% csrf_token %}
            {% for f in form %}
                {{ f }}
                <div class="form-error">
                  {% if f.errors %}
                  <ul class="errorlist nonfield">
                    {% for error in f.errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                  </ul>
                  {% endif %}
                </div>
            {% endfor %}
            <button class="btn btn-primary" type="submit">Создать тему</button>
        </form>
</div>

{% endblock %}
