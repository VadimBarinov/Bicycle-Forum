{%load static%}
<!-- фильтр -->

<div class="d-flex section-filter-container">
    <div>
        <form method="get">
            <input
                type="hidden"
                name="is_ascending"

                {% if is_ascending %}
                value="{{ is_ascending }}"
                {% endif %}

            />
            <button type="submit" class="border my-border my-btn-search btn-right" name="click_ascending">
                {% if is_ascending %}
                <img
                  width="20"
                  src="{% static 'forum/images/ascending_filter.png' %}"
                />
                {% else %}
                <img
                  width="20"
                  src="{% static 'forum/images/descending_filter.png' %}"
                />
                {% endif %}
            </button>
        </form>
    </div>
</div>
