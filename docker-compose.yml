services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web_forum
    restart: always
#    ports:
#      - '8000:8000'
    volumes:
      - web_data:/web
    depends_on:
      - postgres
    networks:
      - backend
      - server

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - web_data:/web
    depends_on:
      - web
      - postgres
    networks:
      - server

  postgres:
    image: postgres:18
    container_name: postgres_forum
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty1234
      POSTGRES_DB: db_forum
      PGDATA: /var/lib/postgresql/18/data/pgdata_forum
    ports:
      - '5432:5432'
    volumes:
      - pgdata_forum:/var/lib/postgresql/18/data/pgdata_forum
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    restart: always
    tty: true
    stdin_open: true
    networks:
      - backend


networks:
  backend:
  server:


volumes:
  pgdata_forum:
  web_data:
